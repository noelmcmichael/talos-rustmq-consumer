apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustmq-consumer
  namespace: data-pipeline
  labels:
    app: rustmq-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustmq-consumer
  template:
    metadata:
      labels:
        app: rustmq-consumer
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      containers:
      - name: consumer
        image: harbor.int-talos-poc.pocketcove.net/library/rustmq-consumer:latest
        imagePullPolicy: Always
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        env:
        - name: RUSTMQ_HOST
          value: "rustmq-0.rustmq-headless.data-pipeline.svc.cluster.local"
        - name: RUSTMQ_PORT
          value: "9093"
        - name: POLL_INTERVAL_MS
          value: "1000"
        - name: RUST_LOG
          value: "rustmq_consumer=info"
